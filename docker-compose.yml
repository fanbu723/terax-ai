name: terax-build

# Build environment for Terax. The source tree is bind-mounted read/write, but
# every toolchain directory (node_modules, Cargo target/registry, generated
# Tauri schemas, pnpm store) is redirected into container volumes, so nothing
# is compiled or cached on the host. Finished bundles are copied to ./artifacts.
x-terax-build: &terax-build
  build:
    context: .
    dockerfile: Dockerfile
  image: terax-build:local
  working_dir: /workspace
  init: true
  environment:
    APPIMAGE_EXTRACT_AND_RUN: "1"
  volumes:
    - .:/workspace
    - node_modules:/workspace/node_modules
    # pnpm keeps its content-addressable store next to the workspace, so it is
    # a volume too rather than a dot-directory in the host checkout.
    - pnpm_store:/workspace/.pnpm-store
    - cargo_target:/workspace/src-tauri/target
    - cargo_registry:/usr/local/cargo/registry
    - cargo_git:/usr/local/cargo/git
    - tauri_gen:/workspace/src-tauri/gen
    - tauri_binaries:/workspace/src-tauri/binaries

services:
  dev:
    <<: *terax-build
    command: ["shell"]
    stdin_open: true
    tty: true

volumes:
  node_modules:
  cargo_target:
  cargo_registry:
  cargo_git:
  tauri_gen:
  tauri_binaries:
  pnpm_store:
